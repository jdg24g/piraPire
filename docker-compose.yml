services:
  web:
    build: .
    container_name: pirapire_backend
    restart: always
    ports:
      - "25610:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ponytail: comando de producción básico con Gunicorn y estáticos por WhiteNoise
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python init_admin.py && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
